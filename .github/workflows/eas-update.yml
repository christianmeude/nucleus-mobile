name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish update to Preview channel
        # --environment is load-bearing: without it the OTA bundle ships with
        # empty EXPO_PUBLIC_* vars (CI has no .env) and overrides the native
        # build's baked-in env on every preview install. Seen 2026-10-10:
        # fixed 4b1dbb APK still failed login until republished with env.
        run: eas update --branch preview --environment production --message "${{ github.event.head_commit.message }}"
