name: Deploy download page

on:
  push:
    branches: [main]
    paths:
      - 'download/**'
      - '.github/workflows/deploy-download-page.yml'
  # The release workflow bumps download/latest.json with GITHUB_TOKEN, and
  # such pushes never trigger `push` workflows (loop protection) — so without
  # this, the page would never pick up a new release on its own.
  workflow_run:
    workflows: ['Release APK (tag)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed/cancelled release must never redeploy the page.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: download
      - id: deployment
        uses: actions/deploy-pages@v4
